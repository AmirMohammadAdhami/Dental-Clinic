<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dentura — Where Confidence Begins With Your Smile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid"></div>

<header class="header">
  <div class="header-inner">

    <!-- سمت راست: لوگو -->
    <div class="brand">
      <span class="brand-icon">
        <svg viewBox="0 0 48 48" width="30" height="30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 6C18.5 6 14 8.6 11.2 12.4C9.3 15 9 18.3 9.4 21.5C9.8 25 10.8 28.4 11.7 31.8C12.4 34.5 13 37.4 14.6 39.7C15.5 41 17 42 18.6 41.4C20.1 40.8 20.6 39 20.9 37.6C21.4 35 21.4 32.3 21.9 29.7C22.2 28.1 22.9 26.2 24 26.2C25.1 26.2 25.8 28.1 26.1 29.7C26.6 32.3 26.6 35 27.1 37.6C27.4 39 27.9 40.8 29.4 41.4C31 42 32.5 41 33.4 39.7C35 37.4 35.6 34.5 36.3 31.8C37.2 28.4 38.2 25 38.6 21.5C39 18.3 38.7 15 36.8 12.4C34 8.6 29.5 6 24 6Z"
                fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-name">دنتورا</span>
    </div>

    <!-- منو (فعلا خالی) -->
    <nav class="nav"></nav>

    <!-- سمت چپ: دکمه رزرو -->
    <div class="header-actions">
      <button class="btn btn-primary btn-sm">رزرو نوبت</button>
    </div>

  </div>
</header>

<main class="hero">
  <div class="hero-inner">

    <h1 class="hero-title">
      <span class="line">جایی که اعتماد به نفس شما</span>
      <span class="line accent">با لبخندتان آغاز می‌شود</span>
    </h1>

    <p class="hero-subtitle">
      دندان‌پزشکی مدرن، طراحی‌شده برای هر لبخند؛ از معاینات ساده تا درمان‌های تخصصی، با دقت و آرامش خاطر.
    </p>

    <div class="gallery">
      <div class="tile tile-photo tile-photo-4">
        <img src="assets/clinic-detail.jpg" alt="فضای مطب">
      </div>

      <div class="tile tile-photo tile-photo-1">
        <img src="assets/patient-woman.jpg" alt="درمان دندان‌پزشکی">
      </div>

      <div class="tile tile-photo tile-photo-2">
        <img src="assets/dentist-work.jpg" alt="پزشک در حال معاینه">
      </div>

      <div class="tile tile-photo tile-photo-3">
        <img src="assets/happy-patient.jpg" alt="بیمار خندان">
      </div>

      <div class="tile tile-accent">
        <div class="tile-accent-photo">
          <img src="assets/smile-detail.jpg" alt="لبخند بیمار">
        </div>
        <div class="tile-accent-info">
          <div class="tile-stat-block">
            <div class="tile-number">۱۵<span>+</span></div>
            <div class="tile-label">سال سابقه<br>خدمات درمانی</div>
          </div>
          <div class="tile-divider"></div>
          <div class="tile-stat-block">
            <div class="tile-number">۵<span>هزار+</span></div>
            <div class="tile-label">لبخند رضایت‌مند</div>
          </div>
        </div>
      </div>
    </div>


    <div class="hero-cta">
      <button class="btn btn-primary btn-lg">رزرو نوبت</button>
      <button class="btn btn-outline btn-lg">نمونه کارها</button>
    </div>

  </div>
</main>

<script src="script.js"></script>
</body>
</html>
