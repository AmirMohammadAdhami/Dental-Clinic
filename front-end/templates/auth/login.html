<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود — دنتورا</title>
    <link rel="stylesheet" href="../../statics/styles/base.css">
    <link rel="stylesheet" href="../../statics/styles/shared.css">
    <link rel="stylesheet" href="../../statics/styles/auth/auth.css">
</head>
<body>
<div class="auth-page">
    <!-- Backdrop -->
    <div class="auth-backdrop"></div>

    <div class="auth-card">
        <!-- Progress Indicator -->
        <div class="auth-progress">
            <div class="auth-progress-track">
                <div class="auth-progress-fill" style="width: 33%"></div>
            </div>
            <div class="auth-progress-dots">
                <span class="auth-dot is-active" data-step="1">۱</span>
                <span class="auth-dot" data-step="2">۲</span>
                <span class="auth-dot" data-step="3">۳</span>
            </div>
        </div>

        <!-- Login Form -->
        <div class="auth-slide is-active">
            <h1 class="auth-title">ورود / ثبت‌نام در دنتورا</h1>
            <p class="auth-subtitle">برای ورود یا عضویت، شماره موبایل خود را وارد کنید.</p>
            <form class="auth-form" id="loginForm">
                <div class="auth-phone-field">
                    <span class="auth-phone-badge">🇮🇷 +۹۸</span>
                    <input type="tel" class="auth-input auth-phone-input" id="loginPhone" value="" maxlength="10" placeholder="912XXXXXXX" inputmode="numeric" required>
                </div>
                <p class="auth-terms">ورود شما به معنای پذیرش <a href="#">شرایط و قوانین</a> دنتورا است.</p>
                <div class="auth-btn-row">
                    <button type="submit" class="btn btn-primary auth-submit" id="loginSubmitBtn">
                        <span class="auth-btn-text">دریافت کد تایید</span>
                        <span class="auth-btn-spinner" style="display:none"><span class="auth-spinner"></span></span>
                    </button>
                    <a href="../home/index.html" class="auth-home-btn" title="خانه">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    </a>
                </div>
            </form>
        </div>

        <!-- Success State -->
        <div class="auth-success" id="loginSuccess" style="display:none">
            <div class="auth-success-check">
                <svg width="80" height="80" viewBox="0 0 80 80">
                    <circle class="auth-success-circle" cx="40" cy="40" r="36" fill="none" stroke="#10b981" stroke-width="3"/>
                    <polyline class="auth-success-tick" points="24,42 34,52 56,28" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h2 class="auth-success-title">کد تایید ارسال شد!</h2>
            <p class="auth-success-text">کد ۵ رقمی به شماره شما ارسال شد</p>
        </div>
    </div>
</div>

<script src="../../statics/scripts/shared.js?v=2"></script>
<script src="../../statics/scripts/auth/auth-login.js"></script>
</body>
</html>
