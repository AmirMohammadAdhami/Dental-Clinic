<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود — دنتورا</title>
    <link rel="stylesheet" href="style.css">
    <script>if('scrollRestoration' in history) history.scrollRestoration='manual';</script>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <a href="index.html" class="auth-logo">
            <svg viewBox="0 0 48 48" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 6C18.5 6 14 8.6 11.2 12.4C9.3 15 9 18.3 9.4 21.5C9.8 25 10.8 28.4 11.7 31.8C12.4 34.5 13 37.4 14.6 39.7C15.5 41 17 42 18.6 41.4C20.1 40.8 20.6 39 20.9 37.6C21.4 35 21.4 32.3 21.9 29.7C22.2 28.1 22.9 26.2 24 26.2C25.1 26.2 25.8 28.1 26.1 29.7C26.6 32.3 26.6 35 27.1 37.6C27.4 39 27.9 40.8 29.4 41.4C31 42 32.5 41 33.4 39.7C35 37.4 35.6 34.5 36.3 31.8C37.2 28.4 38.2 25 38.6 21.5C39 18.3 38.7 15 36.8 12.4C34 8.6 29.5 6 24 6Z" fill="currentColor"/>
            </svg>
            <span class="auth-logo-text">دنتورا</span>
        </a>
        <h1 class="auth-title">ورود / ثبت‌نام در دنتورا</h1>
        <p class="auth-subtitle">برای ورود یا عضویت، شماره موبایل خود را وارد کنید.</p>
        <form class="auth-form" id="authPhoneForm">
            <div class="auth-input-wrap auth-input-phone">
                <svg class="auth-input-icon auth-input-icon--left" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                <input type="tel" class="auth-input" id="authPhone" value="09" maxlength="11" placeholder="09xxxxxxxxx" autocomplete="tel" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-lg auth-submit">دریافت کد تایید</button>
        </form>
        <p class="auth-terms">ورود شما به معنای پذیرش <a href="#">شرایط و قوانین</a> دنتورا است.</p>
    </div>
</div>
</body>
</html>
