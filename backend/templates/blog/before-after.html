{% extends "base.html" %}
{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static "css/base.css" %}">
    <link rel="stylesheet" href="{% static "css/shared.css" %}">
    <link rel="stylesheet" href="{% static "css/home/home.css" %}">
    <link rel="stylesheet" href="{% static "css/blog/before-after-page.css" %}">
{% endblock %}

{% block js %}
<script src="{% static "js/shared.js" %}"></script>
<script src="{% static "js/home/home.js" %}"></script>
<script src="{% static "js/blog/before-after.js" %}"></script>
{% endblock %}

{% block title %}نمونه کارها — دنتورا{% endblock %}

{% block content %}
<main class="ba-page" id="main-content" tabindex="-1">
    <div class="ba-page-inner">
        <div class="ba-page-header reveal">
            <h1 class="ba-page-title">نمونه کارهای دنتورا</h1>
            <p class="ba-page-subtitle">نتیجه واقعی درمان‌های زیبایی و ترمیمی ما را ببینید</p>
        </div>
        <div class="ba-filters reveal" role="tablist" aria-label="فیلتر نوع درمان">
            <button class="ba-filter-btn is-active" data-filter="all" role="tab" aria-selected="true">همه</button>
            <button class="ba-filter-btn" data-filter="implant" role="tab" aria-selected="false">ایمپلنت</button>
            <button class="ba-filter-btn" data-filter="veneer" role="tab" aria-selected="false">ونیر</button>
            <button class="ba-filter-btn" data-filter="laminate" role="tab" aria-selected="false">لمینت</button>
            <button class="ba-filter-btn" data-filter="composite" role="tab" aria-selected="false">کامپوزیت</button>
        </div>
        <div class="ba-grid" id="baGrid"></div>
        <nav class="ba-pagination reveal" aria-label="صفحه‌بندی نمونه کارها">
            <button class="ba-page-btn" aria-label="صفحه بعد">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            <button class="ba-page-num is-active">۱</button>
            <button class="ba-page-num">۲</button>
            <button class="ba-page-num">۳</button>
            <button class="ba-page-num">۴</button>
            <span class="ba-page-dots">...</span>
            <button class="ba-page-num">۸</button>
            <button class="ba-page-btn" aria-label="صفحه قبل">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </button>
        </nav>
    </div>
</main>
{% endblock %}
