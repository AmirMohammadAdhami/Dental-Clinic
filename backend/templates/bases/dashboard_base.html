{% load static %}


<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>{% block title %}{% endblock %}</title>


    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/shared.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard/base.css' %}">



    {% block css %}{% endblock %}
</head>
<body>

<a href="#main-content" class="skip-link">رفتن به محتوای اصلی</a>
<div class="bg-grid"></div>
<div class="tooth-pattern"></div>

<!-- ================= DASHBOARD HEADER BAR ================= -->
<header class="dash-header">
    <div class="dash-header-inner">
        {% block greeting %}{% endblock %}
        <nav class="dash-nav" aria-label="منوی پنل">
            <a href="{% url 'dashboard:dashboard' %}" class="dash-nav-icon" data-tooltip="داشبورد"
               aria-label="داشبورد">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="9" rx="1"/>
                    <rect x="14" y="3" width="7" height="5" rx="1"/>
                    <rect x="14" y="12" width="7" height="9" rx="1"/>
                    <rect x="3" y="16" width="7" height="5" rx="1"/>
                </svg>
            </a>
            <a href="{% url 'dashboard:appointments' %}" class="dash-nav-icon" data-tooltip="نوبت‌ها" aria-label="نوبت‌ها">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
            </a>
            <a href="{% url 'dashboard:gallery' %}" class="dash-nav-icon" data-tooltip="گالری" aria-label="گالری">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </a>
            <a href="{% url 'dashboard:notifications' %}" class="dash-nav-icon dash-nav-icon--notif" data-tooltip="اعلان‌ها"
               aria-label="اعلان‌ها">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="dash-notif-badge"></span>
            </a>
            <a href="{% url 'core:home' %}" class="dash-nav-icon" data-tooltip="خانه" aria-label="خانه">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </a>
            <a href="{% url 'core:home' %}" class="dash-nav-icon dash-nav-icon--exit" data-tooltip="خروج"
               aria-label="خروج">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </a>
        </nav>
    </div>
</header>


{% block content %}{% endblock %}

<!-- ================= MOBILE BOTTOM NAV ================= -->
<nav class="dash-bottomnav" aria-label="منوی پایین">
    <a href="{% url 'dashboard:dashboard' %}" class="dash-bottomnav-item dash-bottomnav-item--dash">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9" rx="1"/>
            <rect x="14" y="3" width="7" height="5" rx="1"/>
            <rect x="14" y="12" width="7" height="9" rx="1"/>
            <rect x="3" y="16" width="7" height="5" rx="1"/>
        </svg>
        <span>داشبورد</span>
    </a>
    <a href="{% url 'dashboard:appointments' %}" class="dash-bottomnav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>نوبت‌ها</span>
    </a>
    <a href="{% url 'dashboard:gallery' %}" class="dash-bottomnav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>گالری</span>
    </a>
    <a href="{% url 'dashboard:notifications' %}" class="dash-bottomnav-item dash-bottomnav-item--notif">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span>اعلان‌ها</span>
        <span class="dash-bottomnav-badge"></span>
    </a>
    <a href="{% url 'core:home' %}" class="dash-bottomnav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>خانه</span>
    </a>
    <a href="{% url 'core:home' %}" class="dash-bottomnav-item dash-bottomnav-item--exit">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>خروج</span>
    </a>
</nav>

<script src="{% static 'js/shared.js' %}"></script>
{% block js %}{% endblock %}
</body>
</html>
