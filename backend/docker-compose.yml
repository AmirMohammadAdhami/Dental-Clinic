services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_data:/app/backend/staticfiles
      - ./media:/app/backend/media
      - ./db.sqlite3:/app/backend/db.sqlite3
    depends_on:
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file: .env
    volumes:
      - static_data:/app/backend/staticfiles
      - ./media:/app/backend/media
      - ./db.sqlite3:/app/backend/db.sqlite3
    depends_on:
      - backend
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    env_file: .env
    volumes:
      - static_data:/app/backend/staticfiles
      - ./media:/app/backend/media
      - ./db.sqlite3:/app/backend/db.sqlite3
    depends_on:
      - backend
      - redis

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/backend/staticfiles:ro
      - ./media:/app/backend/media:ro
    depends_on:
      - backend

volumes:
  static_data:
