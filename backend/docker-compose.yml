services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_data:/app/backend/staticfiles
      - media_data:/app/backend/media

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/backend/staticfiles:ro
      - media_data:/app/backend/media:ro
    depends_on:
      - backend

volumes:
  static_data:
  media_data:
